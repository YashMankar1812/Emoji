<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Search | Find & Copy Emojis</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body style="background-image: url('https://img.freepik.com/free-vector/emoticons-with-empty-space-background_79603-1023.jpg'); 
             background-size: cover;
             background-position: center;
             background-attachment: fixed;
             background-repeat: no-repeat;">
    <div class="main">
        <header class="app-header" >
            <h1 class="app-title">Emoji Search</h1>
            <p class="app-description">Find and copy your favorite emojis with ease</p>
        </header>
        
        <div class="navbar">
            <div class="search-container">
                <span class="search-icon">🔍</span>
                <input id="search" type="text" placeholder="Search emojis...">
            </div>
            
            <div class="filter-container" id="filter-emogi">
                <button class="filter-btn active" data-category="all">All</button>
                <button class="filter-btn" data-category="face">Face</button>
                <button class="filter-btn" data-category="heart">Heart</button>
                <button class="filter-btn" data-category="book">Book</button>
                <button class="filter-btn" data-category="hand">Hand</button>
                <button class="filter-btn" data-category="sports">Sports</button>
                <button class="filter-btn" data-category="flag">Flag</button>
            </div>
        </div>
        
        <div id="display-emoji" class="emoji-container"></div>
    </div>
    
    <div class="copied-notification" id="copied-notification">
        Emoji copied to clipboard!
    </div>
    
    <audio id="click-sound" src="assets/waterdrop-86537.mp3"></audio>
 
    <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
